# Configuration File for Claude GitHub Integration Test

[application]
name = "claude-test-repo"
version = "1.0.0"
author = "Claude AI Assistant"
description = "GitHub MCP Integration Test Application"

[settings]
debug = false
log_level = "INFO"
output_format = "json"
timestamp_format = "%Y-%m-%d %H:%M:%S"

[validation]
min_length = 1
max_length = 1000
allowed_patterns = ["^[a-zA-Z0-9\\s\\-_]+$"]

[processing]
uppercase_output = true
include_timestamp = true
hash_algorithm = "md5"

[paths]
src_dir = "src"
tests_dir = "tests" 
docs_dir = "docs"
output_dir = "output"

# Feature flags
[features]
enable_hashing = true
enable_validation = true
enable_processing = true
enable_logging = true
